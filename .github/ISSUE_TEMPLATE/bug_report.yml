name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please don't include secrets, tokens or private audio.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The task config.yaml (trimmed), the command or job you ran, and the full error.
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "Output of `audio-ops doctor`"
      render: text
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Dagster pipeline / training, Inference API / streaming, Task API / scaffolding, Docker / deployment, Docs, Other]
