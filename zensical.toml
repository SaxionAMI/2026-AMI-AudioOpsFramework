[project]
site_name = "Audio Ops Framework"
site_description = "Audio machine learning pipelines and streaming inference from small task definitions."
site_author = "Saxion University of Applied Sciences"
site_url = "https://saxionami.github.io/2026-AMI-AudioOpsFramework/"
copyright = "Copyright &copy; 2026 Saxion University of Applied Sciences. Apache-2.0"
repo_url = "https://github.com/SaxionAMI/2026-AMI-AudioOpsFramework"
repo_name = "SaxionAMI/2026-AMI-AudioOpsFramework"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/installation.md",
    "getting-started/quickstart.md",
    "getting-started/first-task.md",
  ] },
  { "Concepts" = [
    "concepts/index.md",
    "concepts/why-audio-ops.md",
    "concepts/architecture.md",
    "concepts/capabilities.md",
    "concepts/pipeline.md",
    "concepts/serving.md",
    "concepts/storage.md",
  ] },
  { "Guides" = [
    "guide/tasks.md",
    "guide/features.md",
    "guide/batch-inference.md",
    "guide/streaming.md",
    "guide/serve-wrappers.md",
    "guide/project-repos.md",
    "guide/integrations.md",
    "guide/deployment.md",
    "guide/troubleshooting.md",
  ] },
  { "Reference" = [
    "reference/task-config.md",
    "reference/environment.md",
    "reference/cli.md",
    "reference/http-api.md",
    "reference/python-api.md",
  ] },
  { "Project" = [
    "project/used-in.md",
    "project/contributing.md",
    "project/roadmap.md",
    "project/changelog.md",
    "project/license.md",
    "project/publishing.md",
  ] },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/audio-waveform"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/SaxionAMI/2026-AMI-AudioOpsFramework"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
