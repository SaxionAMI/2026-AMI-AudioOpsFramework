# GPU overlay — apply on top of the core and/or inference compose to run on an
# NVIDIA runtime:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#   docker compose -f docker-compose.inference.yml -f docker-compose.gpu.yml up -d
#
# Requires the NVIDIA Container Toolkit on the host.

version: "3.8"

services:
  dagster:
    environment:
      - DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  inference:
    environment:
      - DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
