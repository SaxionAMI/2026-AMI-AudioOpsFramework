# GPU overlay for the CORE (Dagster) services:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Builds CUDA PyTorch wheels and reserves an NVIDIA GPU for the webserver and
# the daemon (the daemon launches queued/scheduled runs). Requires the NVIDIA
# Container Toolkit. For the inference service use docker-compose.inference.gpu.yml.

x-gpu: &gpu
  image: audio-ops-dagster:local-gpu
  build:
    context: .
    dockerfile: docker/Dockerfile.dagster
    args:
      TORCH_INDEX_URL: ${TORCH_CUDA_INDEX_URL:-https://download.pytorch.org/whl/cu124}
  environment:
    DEVICE: cuda
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  dagster: *gpu
  dagster-daemon: *gpu
