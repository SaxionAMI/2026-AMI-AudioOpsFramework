###############################################################################
# MediaMTX — Audio Ops demo media server
#
#   rtsp://mediamtx:8554/demo         loops /test_audio/demo.wav on demand
#   rtsp://mediamtx:8554/microphone   publish target (RTSP, or WHIP from a browser:
#                                     http://<host>:8889/microphone/whip)
#
# Generate the demo file with:
#   audio-ops demo-data --stream-demo mediamtx/test_audio/demo.wav
#
# Add your own on-demand paths below (one ffmpeg publisher per file).
# Low-latency HLS keeps "listen" playback close to the inference events.
###############################################################################

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

metrics: yes
metricsAddress: :9998

rtsp: yes
rtspAddress: :8554

hls: yes
hlsVariant: lowLatency
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAllowOrigins: ['*']

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ['*']

paths:
  # Publish target for a browser microphone (WHIP/WebRTC) or any RTSP publisher.
  microphone:
    source: publisher

  # Loops the generated demo file whenever someone reads the path.
  demo:
    runOnDemand: >-
      ffmpeg -re -stream_loop -1 -i /test_audio/demo.wav
      -c:a aac -b:a 128k -ar 44100 -ac 1 -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnDemandCloseAfter: 10s

  # Example: add more demo streams
  # my_stream:
  #   runOnDemand: >-
  #     ffmpeg -re -stream_loop -1 -i /test_audio/my_file.wav
  #     -c:a aac -b:a 128k -ar 44100 -ac 1 -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
  #   runOnDemandCloseAfter: 10s
