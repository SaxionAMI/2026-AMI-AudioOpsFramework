logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

metrics: yes
metricsAddress: :9998

rtsp: yes
rtspAddress: :8554

hls: yes
hlsVariant: fmp4
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsAllowOrigin: '*'

webrtc: yes
webrtcAddress: :8889

# This allows your Grafana dashboard to talk to it
webrtcAllowOrigin: "*"

paths:
  all:
    sourceProtocol: udp

  microphone:
    source: publisher

  stadium_north:
    runOnInit: ffmpeg -re -stream_loop -1 -i /test_audio/demo_football_sound.wav -c:a libopus -b:a 32k -ar 48000 -ac 1 -f rtsp rtsp://localhost:8554/stadium_north
    runOnInitRestart: yes

  stadium_south:
    runOnInit: ffmpeg -re -stream_loop -1 -i /test_audio/cheering_stadium_crowd.wav -c:a libopus -b:a 32k -ar 48000 -ac 1 -f rtsp rtsp://localhost:8554/stadium_south
    runOnInitRestart: yes

  stadium_east:
    runOnInit: ffmpeg -re -stream_loop -1 -i /test_audio/angry_stadium_crowd.wav -c:a libopus -b:a 32k -ar 48000 -ac 1 -f rtsp rtsp://localhost:8554/stadium_east
    runOnInitRestart: yes

  stadium_west:
    runOnInit: ffmpeg -re -stream_loop -1 -i /test_audio/demo_football_sound2.wav -c:a libopus -b:a 32k -ar 48000 -ac 1 -f rtsp rtsp://localhost:8554/stadium_west
    runOnInitRestart: yes