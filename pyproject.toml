[tool.poetry]
name = "audio-ops-framework"
version = "1.0.0"
description = "Audio operations framework - shared core and full ML/training stack"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "audio_ops_dagster" },
    { include = "audio_ops_inference" },
]

[tool.poetry.scripts]
audio-ops-serve = "audio_ops_inference.cli:main"

[tool.dagster]
module_name = "audio_ops_dagster.definitions"

[tool.poetry.urls]
Homepage = "https://github.com/your-org/audio-ops-framework"
Repository = "https://github.com/your-org/audio-ops-framework"
Documentation = "https://audio-ops.readthedocs.io"

# ════════════════════════════════════════════════════════════════════════════
# All Dependencies
# ════════════════════════════════════════════════════════════════════════════

[tool.poetry.dependencies]
python = ">=3.10,<3.15"

# Shared Utilities & Configuration
pyyaml = "^6"
python-dotenv = "^1"
pydantic = "^2"
pydantic-settings = "^2"
python-multipart = "^0.0.6"

# Logging
structlog = "^23"
python-json-logger = "^2"

# Orchestration & Workflow
dagster = "^1.6"
dagster-webserver = "^1.6"

# ML & Audio
torch = "^2.2.0"
torchaudio = "^2.2.0"
torchvision = "^0.17.0"
librosa = "^0.10"
faster-whisper = "^1.0"
onnxruntime = ">=1.16,<1.18"
numpy = "^1.24"
scipy = "^1.11"
pandas = "^2"
scikit-learn = "^1.2"

# NLP & Transformers
transformers = "^4.30"
datasets = "^2.14"
jiwer = "^3.0"

# Experiment Tracking & MLOps
mlflow = "^2.12"

# Storage & Database
minio = "^7.2"
influxdb-client = "^1.18"
sqlalchemy = "^2"
boto3 = "^1.34"

# ════════════════════════════════════════════════════════════════════════════
# Development Dependencies
# ════════════════════════════════════════════════════════════════════════════
soundfile = "^0.14.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "^4.1"
pytest-asyncio = "^0.21"
black = "^23"
flake8 = "^6.1"
mypy = "^1.7"
isort = "^5.13"
jupyter = "^1"
ipython = "^8.17"

# ════════════════════════════════════════════════════════════════════════════
# Tooling
# ════════════════════════════════════════════════════════════════════════════

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "librosa.*",
    "minio.*",
    "influxdb_client.*",
    "dagster.*",
    "torch.*",
    "torchaudio.*",
    "torchvision.*",
    "transformers.*",
    "sklearn.*",
    "faster_whisper.*",
    "mlflow.*",
    "datasets.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "gpu: GPU tests",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"