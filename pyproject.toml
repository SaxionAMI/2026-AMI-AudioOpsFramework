[tool.poetry]
name = "audio-ops-framework"
version = "1.0.0"
description = "Audio operations framework - shared core"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"

# Shared core - no packages defined at root level
# Individual services have their own pyproject.toml

[tool.poetry.dependencies]
python = "^3.10"

# Shared Utilities & Configuration
pyyaml = "^6"
python-dotenv = "^1"
pydantic = "^2"
pydantic-settings = "^2"
python-multipart = "^0.0.6"

# Logging (shared)
structlog = "^23"
python-json-logger = "^2"
jiwer = "^4.0.0"

[tool.poetry.urls]
Homepage = "https://github.com/your-org/audio-ops-framework"
Repository = "https://github.com/your-org/audio-ops-framework"
Documentation = "https://audio-ops.readthedocs.io"

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
check_untyped_defs = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"