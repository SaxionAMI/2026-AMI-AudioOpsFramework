[project]
name = "audio-ops-framework"
version = "1.2.0"
description = "Audio machine learning pipelines and streaming inference from small task definitions, built on Dagster and FastAPI."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Saxion University of Applied Sciences, research group Ambient Intelligence" }]
maintainers = [{ email = "e.m.vanwolfswinkel@saxion.nl" }]
requires-python = ">=3.10,<3.15"
keywords = ["audio", "machine-learning", "mlops", "dagster", "pytorch", "streaming", "inference", "speech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# ── Core (always installed) ─────────────────────────────────────────────────
# The task contract, config schema, registry, feature registry and audio IO.
# Heavy stacks (torch, dagster, fastapi) live behind extras, so a serving-only
# consumer never pulls Dagster/MLflow and a training-only one never pulls
# FastAPI. torch has a floor but no ceiling, so installing the framework can't
# downgrade a consumer's carefully pinned CUDA build.
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "librosa>=0.10.1",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# Full offline pipeline: Dagster assets, trainer, MLflow tracking.
train = [
    "torch>=2.4",
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "mlflow>=2.12",
    "scikit-learn>=1.3",
    "pandas>=2.0",
]
# Streaming inference service only — no Dagster/MLflow.
serve = [
    "torch>=2.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
# feature_type: ast (transformers' ASTFeatureExtractor). ast_librosa needs nothing extra.
ast = ["transformers>=4.30", "torchaudio>=2.4"]
# Object storage (MinIO / S3 / R2 / B2).
s3 = ["boto3>=1.34"]
# InfluxDB metrics sink.
metrics = ["influxdb-client>=1.38"]
all = ["audio-ops-framework[train,serve,ast,s3,metrics]"]
dev = [
    "audio-ops-framework[train,serve,s3,metrics]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=5.0",
]
docs = ["zensical>=0.0.20"]

[project.scripts]
audio-ops = "audio_ops_dagster.cli:main"
audio-ops-serve = "audio_ops_inference.cli:main"

[project.urls]
Homepage = "https://github.com/SaxionAMI/2026-AMI-AudioOpsFramework"
Documentation = "https://saxionami.github.io/2026-AMI-AudioOpsFramework/"
Repository = "https://github.com/SaxionAMI/2026-AMI-AudioOpsFramework"
Issues = "https://github.com/SaxionAMI/2026-AMI-AudioOpsFramework/issues"
Changelog = "https://github.com/SaxionAMI/2026-AMI-AudioOpsFramework/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio_ops", "audio_ops_dagster", "audio_ops_inference"]
exclude = ["**/Dockerfile*"]

[tool.hatch.build.targets.sdist]
include = [
    "audio_ops",
    "audio_ops_dagster",
    "audio_ops_inference",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "NOTICE",
    "env.example",
]

[tool.dagster]
module_name = "audio_ops_dagster.definitions"

# ════════════════════════════════════════════════════════════════════════════
# Tooling
# ════════════════════════════════════════════════════════════════════════════

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["project-template"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # long lines: readability over a hard limit (keep it ~100)
    "E701",   # aligned one-line ifs in metric builders
    "E203",   # whitespace before ':' (aligned assignments)
    "E221",   # multiple spaces before operator (aligned assignments)
    "E241",   # multiple spaces after ',' (aligned literals)
    "B008",   # FastAPI Depends()/File() in defaults
    "B905",   # zip(strict=) — py3.10 floor
    "UP007",  # keep Optional[...] for readability
    "UP045",
    "UP006",
    "UP035",
    "UP031",  # printf-style log lines are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: runs a real Dagster pipeline / API end to end (a few seconds each)",
    "slow: slow tests",
    "gpu: needs a CUDA device",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning:dagster.*",
]

[tool.coverage.run]
source = ["audio_ops", "audio_ops_dagster", "audio_ops_inference"]
omit = ["*/tasks/*"]
