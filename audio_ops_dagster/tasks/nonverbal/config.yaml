# Non-Verbal Audio Event Detection Task Configuration
task_name: nonverbal
feature_type: spectrogram
input_dir: "audio_input/nonverbal"
output_dir: "storage/nonverbal"
split_strategy: "group"

# Event classes — add or remove as needed
num_classes: 8
class_labels:
  - "cough"
  - "pain"
  - "laughter"
  - "sigh"
  - "breathing"
  - "silence"
  - "speech"
  - "other"

model_architecture: resnet18
batch_size: 32
epochs: 20
learning_rate: 0.001
optimizer: adam
criterion: cross_entropy  # use bce_with_logits for multi-label
input_shape: [1, 128, 87]

# Storage
use_remote_storage: true
