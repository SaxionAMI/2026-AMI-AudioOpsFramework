# example_classifier — the reference task. Every key: docs → Reference → Task configuration.
#
# What the task does. trainable_model = train + evaluate + batch_infer + serve.
# Do less with e.g.  archetype: pretrained_servable  or  capabilities: [train, evaluate]
archetype: trainable_model
task_type: classification

# Data: audio under input_dir/<label>/*.wav — the folder name is the label.
# No data yet? `audio-ops demo-data` writes a synthetic set here.
input_dir: audio_input/example_classifier
feature_type: spectrogram     # log-mel (128 × time); also mel, mfcc, raw, ast, …
segment_duration: 1.0         # seconds per segment — the training AND serving window
segment_overlap: 0.25
class_labels: [class_a, class_b, class_c]    # output order
split_strategy: group         # all segments of one recording stay in one split

# Training
epochs: 15
batch_size: 16
learning_rate: 0.002
model_architecture: tiny_cnn  # a label for logs, MLflow and checkpoints
