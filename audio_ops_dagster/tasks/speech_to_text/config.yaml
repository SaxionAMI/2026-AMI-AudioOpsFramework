# Speech-to-Text Task Configuration
# Uses Wav2Vec2 from HuggingFace for automatic speech recognition

# Task identification
task_name: speech_to_text

# Data paths
input_dir: audio_input/speech_to_text
output_dir: storage/speech_to_text

# Audio feature type (raw audio for Wav2Vec2, or mel for fine-tuning)
feature_type: raw  # 'raw' uses waveform directly, 'mel' for spectrogram features

# Model configuration
model_name: facebook/wav2vec2-base-960h  # Pretrained model from HuggingFace
model_architecture: wav2vec2

# Training parameters (for fine-tuning)
batch_size: 4  # Lower batch size for memory efficiency with transformers
epochs: 10
learning_rate: 0.0001  # Lower learning rate for fine-tuning pretrained models
optimizer: adam
criterion: ctc  # CTC loss for speech recognition

# Dataset split strategy
split_strategy: random  # or 'speaker' for speaker-independent splits

# Remote storage (MinIO)
use_remote_storage: true  # Set to true to upload artifacts to MinIO

# Note: For inference, the model will automatically use the pretrained weights
# For fine-tuning, prepare your audio data with corresponding transcriptions