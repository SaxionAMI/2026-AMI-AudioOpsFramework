# tasks/sentiment/config.yaml
task_name: sentiment
feature_type: spectrogram
input_dir: "audio_input/sentiment/CrowdAudioDataport"
output_dir: "storage/sentiment"
split_strategy: "group"
num_classes: 3
class_labels:
  - "approval"
  - "disapproval"
  - "neutral"
model_architecture: resnet18
batch_size: 32
epochs: 10
learning_rate: 0.001
input_shape: [1, 128, 87]
# ── Storage ──────────────────────────────────────────────────────────────────
# Set to true to sync all pipeline artifacts (features, datasets, model
# checkpoints, evaluation reports) to MinIO after each step.
# Leave false for pure local-filesystem runs (default behaviour).
use_remote_storage: true
 
# Optional: override the MinIO bucket path prefix for this task.
# Defaults to the task folder name ("sentiment").
# storage_bucket_prefix: "sentiment_v2"
 