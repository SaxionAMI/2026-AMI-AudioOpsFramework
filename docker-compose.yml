version: '3.8'

services:
  # ════════════════════════════════════════════════════════════════════════════
  # Orchestration & Workflow
  # ════════════════════════════════════════════════════════════════════════════

  dagster:
    build:
      context: .
      dockerfile: ./audio_ops_dagster/Dockerfile.dagster
    container_name: audio-ops-dagster
    ports:
      - "${DAGSTER_PORT:-3000}:3000"
    environment:
      - DAGSTER_HOME=${DAGSTER_HOME:-/app/dagster_home}
      - DAGSTER_AUDIO_TASK=${DAGSTER_AUDIO_TASK:-sentiment}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      # InfluxDB v2
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-audioops}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-audio_metrics}
      - ENABLE_INFLUXDB=true
      # LLM (optional)
      - ENABLE_LLM=${ENABLE_LLM:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://ollama:11434}
      - LLM_MODEL=${LLM_MODEL:-llama3.2}
    entrypoint: [
      "sh", "-c",
      "python /app/generate_dashboards.py /app/grafana_dashboards 2>/dev/null || true && dagster-webserver -h 0.0.0.0 -p 3000 -w /app/workspace.yaml"
    ]
    volumes:
      - ./dagster_home:${DAGSTER_HOME:-/app/dagster_home}
      - ./config:/app/config
      - .:/app
      - ./storage:/app/storage
      - ./audio_input:/app/audio_input
      - grafana_dashboards:/app/grafana_dashboards
    depends_on:
      - minio
      - mlflow
      - influxdb
    networks:
      - audio-ops
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dagster-daemon:
    build:
      context: .
      dockerfile: ./audio_ops_dagster/Dockerfile.dagster
    container_name: audio-ops-daemon
    entrypoint: ["dagster-daemon", "run", "-w", "/app/workspace.yaml"]
    environment:
      - DAGSTER_HOME=${DAGSTER_HOME:-/app/dagster_home}
      - DAGSTER_AUDIO_TASK=${DAGSTER_AUDIO_TASK:-sentiment}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-audioops}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-audio_metrics}
      - ENABLE_INFLUXDB=true
    volumes:
      - ./dagster_home:${DAGSTER_HOME:-/app/dagster_home}
      - ./config:/app/config
      - .:/app
      - ./storage:/app/storage
      - ./audio_input:/app/audio_input
    depends_on:
      - dagster
      - minio
      - influxdb
    networks:
      - audio-ops
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ════════════════════════════════════════════════════════════════════════════
  # Inference & Model Serving
  # ════════════════════════════════════════════════════════════════════════════

  inference:
    build:
      context: .
      dockerfile: ./audio-ops-inference/Dockerfile.inference
    container_name: audio-ops-inference
    ports:
      - "${INFERENCE_PORT:-8000}:8000"
    environment:
      - AUTO_RTSP_STREAMS=   # empty — sensor handles it
      - MINIO_ENDPOINT=minio:9000
      - MINIO_HOST=minio
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      - MINIO_MODELS_BUCKET=audioops-bucket
      - API_SECRET_KEY=${API_SECRET_KEY:-change-me}
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-audioops}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-audio_metrics}
      - ENABLE_INFLUXDB=true
      - INFERENCE_PORT=8000
      - INFERENCE_WORKERS=${INFERENCE_WORKERS:-1}
      # LLM
      - ENABLE_LLM=${ENABLE_LLM:-false}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://ollama:11434}
      - LLM_MODEL=${LLM_MODEL:-llama3.2}
    volumes:
      - ./config:/app/config
      - ./storage:/app/storage
      - ./audio_ops_dagster/tasks:/app/tasks 
      - ./storage:/app/storage
    depends_on:
      - minio
      - influxdb
    networks:
      - audio-ops
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ════════════════════════════════════════════════════════════════════════════
  # Experiment Tracking
  # ════════════════════════════════════════════════════════════════════════════

  mlflow:
    build:
      context: .
      dockerfile: ./mlflow/Dockerfile.mlflow
    container_name: audio-ops-mlflow
    environment:
      - MLFLOW_ALLOWED_HOSTS=${MLFLOW_ALLOWED_HOSTS:-*}
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    entrypoint: >
      /bin/sh -c "mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/data/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --allowed-hosts \"$$MLFLOW_ALLOWED_HOSTS\""
    volumes:
      - ./mlflow/data:/mlflow/data
      - ./mlflow/artifacts:/mlflow/artifacts
    networks:
      - audio-ops
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ════════════════════════════════════════════════════════════════════════════
  # Object Storage (S3-compatible)
  # ════════════════════════════════════════════════════════════════════════════

  minio:
    image: minio/minio:latest
    container_name: audio-ops-minio
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./minio_storage:/data
    command: server /data --console-address ":9001"
    networks:
      - audio-ops
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ════════════════════════════════════════════════════════════════════════════
  # Time-Series Database (InfluxDB v2)
  # ════════════════════════════════════════════════════════════════════════════

  influxdb:
    image: influxdb:2.7-alpine
    container_name: audio-ops-influxdb
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:-admin123}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-audioops}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-audio_metrics}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
    volumes:
      - ./influxdb_data:/var/lib/influxdb2
    networks:
      - audio-ops
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ════════════════════════════════════════════════════════════════════════════
  # Dashboards & Visualization (Grafana)
  # ════════════════════════════════════════════════════════════════════════════

  grafana:
    image: grafana/grafana:latest
    user: "0"
    container_name: audio-ops-grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana_provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana_provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_dashboards:/var/lib/grafana/dashboards
    depends_on:
      - influxdb
      - dagster
    networks:
      - audio-ops
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ════════════════════════════════════════════════════════════════════════════
  # Data Labeling & Annotation
  # ════════════════════════════════════════════════════════════════════════════

  label-studio:
    image: heartexlabs/label-studio:latest
    user: "0"
    container_name: audio-ops-label-studio
    ports:
      - "${LABEL_STUDIO_PORT:-8080}:8080"
    environment:
      LABEL_STUDIO_HOST: 0.0.0.0
      LABEL_STUDIO_PORT: 8080
    volumes:
      - ./label_studio_data:/label-studio/data
    networks:
      - audio-ops
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mediamtx:
    build: ./mediamtx
    hostname: mediamtx
    container_name: mediamtx
    networks:
      - audio-ops
    restart: unless-stopped
    ports:
      - "8554:8554"    # RTSP
      - "1935:1935"    # RTMP
      - "8888:8888"    # HLS (browser playback)
      - "8889:8889"    # WebRTC
      - "9997:9997"    # API
      - "8189:8189/udp" # WebRTC ICE (CRITICAL)
    environment:
      - MTX_WEBRTCICEUDPSERVERPORT=8189
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml
      - ./mediamtx/test_audio:/test_audio

  # ════════════════════════════════════════════════════════════════════════════
  # Local LLM (optional — enable with ENABLE_LLM=true)
  # ════════════════════════════════════════════════════════════════════════════

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: audio-ops-ollama
  #   ports:
  #     - "${OLLAMA_PORT:-11434}:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - audio-ops
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   # After starting: docker exec audio-ops-ollama ollama pull llama3.2

networks:
  audio-ops:
    driver: bridge

volumes:
  dagster_home:
  mlflow_data:
  mlflow_artifacts:
  minio_storage:
  influxdb_data:
  grafana_data:
  label_studio_data:
  grafana_dashboards:
  # ollama_data:
