# Audio Ops Framework — CORE orchestration (training & batch inference).
#
# Runs Dagster only. The streaming inference service is a separate deployable
# (docker-compose.inference.yml) because it has a different operational
# profile: long-running, latency-bound, scaled independently.
#
#   docker compose up -d                                        # core only
#   docker compose -f docker-compose.yml -f docker-compose.inference.yml up -d   # both
#   docker compose -f docker-compose.inference.yml up -d        # inference only
#   GPU: add -f docker-compose.gpu.yml (core) / -f docker-compose.inference.gpu.yml
#
# Optional services (MinIO, InfluxDB, MLflow server, Grafana, an LLM) are not
# bundled; the code runs without them. See docs/guide/integrations.md.

x-dagster-env: &dagster-env
  DAGSTER_HOME: /app/dagster_home
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  ENABLE_INFLUXDB: ${ENABLE_INFLUXDB:-false}
  MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-sqlite:////app/mlruns/mlflow.db}
  ENABLE_LLM: ${ENABLE_LLM:-false}
  AUDIO_OPS_TASKS_DIR: ${AUDIO_OPS_TASKS_DIR:-}
  DEVICE: ${DEVICE:-auto}

x-dagster-common: &dagster-common
  build:
    context: .
    dockerfile: docker/Dockerfile.dagster
  image: audio-ops-dagster:local
  env_file:
    - path: .env
      required: false
  environment: *dagster-env
  volumes:
    - .:/app                       # live source (dev); remove for an immutable deploy
    - ./dagster_home:/app/dagster_home
    - ./storage:/app/storage
    - ./audio_input:/app/audio_input
    - ./mlruns:/app/mlruns
  networks: [audio-ops]
  restart: unless-stopped

services:
  dagster:
    <<: *dagster-common
    container_name: audio-ops-dagster
    ports:
      - "${DAGSTER_PORT:-3000}:3000"
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/app/workspace.yaml"]

  dagster-daemon:
    <<: *dagster-common
    container_name: audio-ops-daemon
    command: ["dagster-daemon", "run", "-w", "/app/workspace.yaml"]
    depends_on: [dagster]

networks:
  audio-ops:
    driver: bridge
