# Audio Ops Framework — STREAMING INFERENCE service (+ a demo media server).
#
# Long-running, latency-bound; holds models in memory and consumes file / RTSP /
# WebSocket audio, emitting results over SSE. Reads trained checkpoints from the
# shared ./storage volume or from object storage (STORAGE_BACKEND=minio).
#
#   docker compose -f docker-compose.inference.yml up -d                 # standalone
#   docker compose -f docker-compose.yml -f docker-compose.inference.yml up -d
#   add -f docker-compose.inference.gpu.yml                               # GPU
#
# Scale horizontally behind a load balancer; state is per-connection only.
# Demo audio: `audio-ops demo-data --stream-demo mediamtx/test_audio/demo.wav`.

services:
  inference:
    build:
      context: .
      dockerfile: docker/Dockerfile.inference
    image: audio-ops-inference:local
    container_name: audio-ops-inference
    ports:
      - "${INFERENCE_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      AUDIO_OPS_TASKS_DIR: ${AUDIO_OPS_TASKS_DIR:-}
      MODELS_DIR: /app/models
      MODEL_CACHE_DIR: /app/models
      ENABLE_INFLUXDB: ${ENABLE_INFLUXDB:-false}
      ENABLE_LLM: ${ENABLE_LLM:-false}
      ENABLE_FUSION: ${ENABLE_FUSION:-false}
      DEVICE: ${DEVICE:-auto}
      CHUNK_MS: ${CHUNK_MS:-1000}
      API_KEY: ${API_KEY:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      STREAM_AUTODISCOVER: ${STREAM_AUTODISCOVER:-false}
      MEDIAMTX_API_URL: http://mediamtx:9997
      RTSP_BASE_URL: rtsp://mediamtx:8554
      AUTO_RTSP_STREAMS: ${AUTO_RTSP_STREAMS:-}
      DEMO_AUDIO_PATH: /test_audio/demo.wav
    volumes:
      - ./storage:/app/storage:ro                      # checkpoints written by training
      - model-cache:/app/models                        # HF/TF-Hub downloads (persisted)
      - ./audio_ops_dagster:/app/audio_ops_dagster     # live source (dev)
      - ./audio_ops_inference:/app/audio_ops_inference
      - ./mediamtx/test_audio:/test_audio:ro
    networks: [audio-ops]
    restart: unless-stopped

  mediamtx:
    build: ./mediamtx
    hostname: mediamtx
    container_name: mediamtx
    networks: [audio-ops]
    restart: unless-stopped
    ports:
      - "8554:8554"     # RTSP
      - "8888:8888"     # HLS
      - "8889:8889"     # WebRTC (WHIP/WHEP)
      - "9997:9997"     # API
      - "8189:8189/udp" # WebRTC ICE
    environment:
      MTX_WEBRTCICEUDPSERVERPORT: 8189
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./mediamtx/test_audio:/test_audio:ro

volumes:
  model-cache:

networks:
  audio-ops:
    driver: bridge
