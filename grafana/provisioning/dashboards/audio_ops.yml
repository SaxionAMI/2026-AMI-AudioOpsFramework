apiVersion: 1

providers:
  - name: Audio-Ops Dashboards
    orgId: 1
    folder: Audio Ops
    folderUid: audio_ops
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false