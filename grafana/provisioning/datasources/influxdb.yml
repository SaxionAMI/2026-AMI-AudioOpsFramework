apiVersion: 1

datasources:
  - name: InfluxDB-AudioOps
    type: influxdb
    uid: influxdb_audio_ops
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: audio_ops
      defaultBucket: audio_metrics
      tlsSkipVerify: true
    secureJsonData:
      token: audio_ops_token
    isDefault: true
    editable: true