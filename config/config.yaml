# Audio Ops Framework - Main Configuration
# Override settings by environment or by service-specific configs

app:
  name: audio-ops-framework
  version: "1.0.0"
  environment: development  # development, staging, production

# Dagster Configuration
dagster:
  host: 0.0.0.0
  port: 3000
  home: /app/dagster_home
  log_level: INFO
  run_storage:
    type: sqlite
    path: /app/dagster_home/dagster.db
  event_log_storage:
    type: sqlite
    path: /app/dagster_home/event_log.db

# MLFlow Configuration
mlflow:
  host: 0.0.0.0
  port: 5000
  tracking_uri: http://mlflow:5000
  backend_store_uri: sqlite:////mlflow/mlflow.db
  artifact_root: /mlflow/artifacts
  log_level: INFO

# MinIO Configuration (S3-compatible)
minio:
  host: minio
  port: 9000
  console_port: 9001
  root_user: minioadmin
  root_password: minioadmin
  bucket_name: audioops-bucket
  region: us-east-1
  use_ssl: false
  secure: false

# InfluxDB Configuration
influxdb:
  host: influxdb
  port: 8086
  organization: audioops
  bucket: audio_metrics
  username: admin
  password: admin123
  auth_token: audioopstoken
  init_mode: setup
  retention_policy: 30d  # 30 days

# Inference Service Configuration
inference:
  host: 0.0.0.0
  port: 8000
  workers: 4
  reload: true
  log_level: INFO
  model_cache_dir: /app/dagster_output
  demo_audio_dir: /app/demo_audio

# Label Studio Configuration
labelstudio:
  host: 0.0.0.0
  port: 8080
  data_dir: /label-studio/data
  ml_timeout_predict: 3600
  ml_timeout_health: 60
  ml_timeout_train: 7200
  gunicorn_workers: 2
  gunicorn_timeout: 36000

# Grafana Dashboard Configuration
grafana:
  host: 0.0.0.0
  port: 3001
  admin_user: admin
  admin_password: admin
  allow_embedding: true
  disable_sanitize_html: true
  data_dir: /var/lib/grafana

# Storage Paths
storage:
  dagster_home: ./dagster_home
  dagster_output: ./dagster_output
  mlflow: ./mlflow
  mlflow_artifacts: ./mlflow/artifacts
  label_studio_data: ./label_studio_data
  minio_data: ./minio_storage
  influxdb_data: ./influxdb_data
  grafana_data: ./grafana_data
  demo_audio: ./demo_audio

# Logging Configuration
logging:
  level: INFO
  format: json  # json or text
  file: logs/audioops.log
  max_size_mb: 100
  backup_count: 5

# Feature Flags
features:
  enable_mlflow: true
  enable_label_studio: true
  enable_inference: true
  enable_grafana: true
  enable_minio: true

# Security
security:
  secret_key: change-me-in-production
  allowed_origins:
    - http://localhost:3000
    - http://localhost:3001
    - http://localhost:8080