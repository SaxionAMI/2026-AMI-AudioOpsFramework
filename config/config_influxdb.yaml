# InfluxDB Configuration
# Time-series database for audio metrics and monitoring

#API operator key g9hn0MWdbLm83GpLCsNGp4vDmdRxEW5sPjdrJCXOSVHCqzXkZVbxsiscnWB-yu02FtKeVWrl9eGoWvuBtjHaFQ==

influxdb:
  # Connection settings
  host: influxdb
  port: 8086
  
  # Initial setup configuration
  init_mode: setup
  
  # Organization and bucket
  organization: audioops
  bucket: audio_metrics
  
  # Authentication
  admin_username: admin
  admin_password: admin123  # Change in production!
  admin_token: g9hn0MWdbLm83GpLCsNGp4vDmdRxEW5sPjdrJCXOSVHCqzXkZVbxsiscnWB-yu02FtKeVWrl9eGoWvuBtjHaFQ==  # Change in production!
  
  # Default retention policy
  retention_policies:
    - name: audio_metrics
      duration: 30d  # 30 days
      shard_duration: 24h
      replication_factor: 1
      default: true
    
    - name: long_term
      duration: 1y  # 1 year
      shard_duration: 7d
      replication_factor: 1
      default: false

# Measurement and tag configuration
measurements:
  audio_quality:
    description: "Audio quality metrics"
    tags:
      - model_name
      - audio_source
      - environment
    fields:
      - signal_to_noise_ratio
      - frequency_response
      - distortion_level
      - clarity_score
  
  inference_metrics:
    description: "Model inference performance"
    tags:
      - model_name
      - model_version
      - endpoint
    fields:
      - inference_time_ms
      - memory_usage_mb
      - gpu_utilization
      - throughput_samples_per_sec
  
  training_metrics:
    description: "Model training progress"
    tags:
      - experiment_id
      - model_name
      - dataset_name
    fields:
      - loss
      - accuracy
      - precision
      - recall
      - f1_score
  
  labeling_progress:
    description: "Data labeling status"
    tags:
      - project_name
      - annotation_type
    fields:
      - total_samples
      - labeled_samples
      - pending_samples
      - completion_percentage
  
  system_health:
    description: "System health and resource usage"
    tags:
      - service_name
      - container_name
    fields:
      - cpu_usage_percent
      - memory_usage_mb
      - disk_usage_mb
      - network_io_bytes

# Authentication and security
auth:
  enabled: true
  retention_policies:
    - name: service_token_30d
      duration: 30d
    - name: admin_token_90d
      duration: 90d

# Backup and recovery
backup:
  enabled: false
  schedule: "0 2 * * *"  # 2 AM daily
  retention: 7d
  location: /influxdb_backups