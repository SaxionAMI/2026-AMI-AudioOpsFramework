# MinIO Configuration
# S3-compatible storage service configuration

minio:
  # Connection settings
  host: minio
  port: 9000
  console_port: 9001
  
  # Credentials
  root_user: minioadmin
  root_password: minioadmin  # Change in production!
  
  # Default bucket configuration
  bucket_name: audioops-bucket
  region: us-east-1
  
  # SSL/TLS settings
  use_ssl: false
  secure: false
  
  # Policy configuration
  policies:
    - name: audioops-policy
      description: "Policy for audio operations bucket access"
      actions:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
        - s3:ListBucket
      resources:
        - "arn:aws:s3:::audioops-bucket/*"
  
  # User/service account configuration
  service_accounts:
    - username: audioops-user
      password: audioops-password  # Change in production!
      description: "Service account for inference and pipeline access"
      policies:
        - audioops-policy


# Data retention policies
retention:
  audio_samples: 90d  # 90 days
  models: 1y         # 1 year
  logs: 30d          # 30 days